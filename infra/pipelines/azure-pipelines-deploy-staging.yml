# Auto-deploys on every green CI run on main (see the `ci` pipeline resource trigger below).
# This requires staging to be running at all times — the "power down when idle" practice is
# paused for the first weeks after production go-live specifically so this can auto-deploy
# without racing a stopped App Service / DB. Powering down on idle + auto-start-in-pipeline is
# a possible future revisit; until then, do not power down staging.
#
# The one exception, and it is deliberate: a *migration-baseline regeneration* requires both
# sites stopped before the merge, so the old build cannot boot against the dropped database and
# rebuild the old schema. This pipeline has no start step, so the sites stay stopped through the
# deploy and are started by hand afterwards — which is exactly the control that operation needs.
# See "the reset is for a regenerated baseline" in infra/ops/db-access-runbook.md. That is a
# pre-launch procedure; it is not a licence to power staging down routinely.
#
# Build-once, deploy-that-artifact: this pipeline does NOT rebuild. It downloads the
# admin/public artifacts produced by a *green* CI run's Publish stage (the `ci` pipeline
# resource below) and deploys exactly those bits. When you run it manually, pick which run to
# deploy (defaults to the latest successful) — so you can only ship a build that passed every
# test tier against the actual commit on main.
#
# Two-app topology (Phase 10b): both host apps live on their own sites on the one plan. The
# ADMIN app is the sole DB-migrating/seeding process, so it deploys FIRST (before the public
# site, which reads the schema admin creates).
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

resources:
  pipelines:
    - pipeline: ci
      source: CI # the display name of the azure-pipelines.yml pipeline
      branch: main # only main runs reach the Publish stage (see azure-pipelines.yml) —
      # without this, "latest CI run" can resolve to a PR-validation run (no Publish stage ran),
      # which never has the artifact and fails download with "Artifact ... was not found"
      trigger:
        branches:
          include: [main] # auto-deploy whenever a CI run on main goes green (reaches Publish)

jobs:
  - deployment: deploy_staging
    displayName: Deploy both apps to Azure App Service (staging)
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps:
            - download: ci
              artifact: admin
              displayName: Download admin artifact (CI-tested build)

            - download: ci
              artifact: public
              displayName: Download public artifact (CI-tested build)

            - task: AzureWebApp@1
              displayName: Deploy admin site (migrates the DB — deploy first)
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-staging-admin"
                package: "$(Pipeline.Workspace)/ci/admin"

            - task: AzureWebApp@1
              displayName: Deploy public site
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-staging-public"
                package: "$(Pipeline.Workspace)/ci/public"
