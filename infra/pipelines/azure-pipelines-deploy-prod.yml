# Manual-only. Production deploys require an approval on the "production" Environment
# (Azure DevOps → Environments → production → Approvals and checks) — configure that
# approval in the UI before this pipeline's first real run; it replaces the old
# GitHub Actions "type YES to confirm" input with a proper gate.
#
# Two-app topology (Phase 10b): publishes and deploys both host apps to their own sites on
# the one plan. The ADMIN app is the sole DB-migrating/seeding process, so it deploys FIRST
# (before the public site, which reads the schema admin creates).
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  - deployment: deploy_production
    displayName: Deploy both apps to Azure App Service (production)
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: UseDotNet@2
              displayName: Setup .NET 10
              inputs:
                packageType: sdk
                useGlobalJson: true

            - script: dotnet publish src/AkeroGarden.Web.Admin --configuration Release --output $(Build.ArtifactStagingDirectory)/admin
              displayName: Publish admin

            - script: dotnet publish src/AkeroGarden.Web.Public --configuration Release --output $(Build.ArtifactStagingDirectory)/public
              displayName: Publish public

            - task: AzureWebApp@1
              displayName: Deploy admin site (migrates the DB — deploy first)
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-prod-admin"
                package: "$(Build.ArtifactStagingDirectory)/admin"

            - task: AzureWebApp@1
              displayName: Deploy public site
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-prod-public"
                package: "$(Build.ArtifactStagingDirectory)/public"
