# Manual-only. Staging is powered down when idle, so deploys are triggered on demand
# (Pipelines → "Deploy — Staging" → Run pipeline) rather than automatically on every
# merge to main. Before running: start staging in order — PostgreSQL first (wait until
# Ready), then the apps — so the on-boot EF migrations succeed.
#
# Build-once, deploy-that-artifact: this pipeline does NOT rebuild. It downloads the
# admin/public artifacts produced by a *green* CI run (the `ci` pipeline resource below)
# and deploys exactly those bits. When you run it manually, pick which CI run to deploy
# (defaults to the latest successful) — so you can only ship a build that passed all tests.
#
# Two-app topology (Phase 10b): both host apps live on their own sites on the one plan. The
# ADMIN app is the sole DB-migrating/seeding process, so it deploys FIRST (before the public
# site, which reads the schema admin creates).
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

resources:
  pipelines:
    - pipeline: ci
      source: CI # the display name of the azure-pipelines.yml pipeline
      trigger: none # stay manual — do not auto-deploy on every CI completion

jobs:
  - deployment: deploy_staging
    displayName: Deploy both apps to Azure App Service (staging)
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps:
            - download: ci
              artifact: admin
              displayName: Download admin artifact (CI-tested build)

            - download: ci
              artifact: public
              displayName: Download public artifact (CI-tested build)

            - task: AzureWebApp@1
              displayName: Deploy admin site (migrates the DB — deploy first)
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-staging-admin"
                package: "$(Pipeline.Workspace)/ci/admin"

            - task: AzureWebApp@1
              displayName: Deploy public site
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-staging-public"
                package: "$(Pipeline.Workspace)/ci/public"
