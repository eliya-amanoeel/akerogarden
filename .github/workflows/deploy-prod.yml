name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: "Type YES to confirm production deploy"
        required: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy
        if: ${{ github.event.inputs.confirmed != 'YES' }}
        run: |
          echo "Deploy cancelled — confirmation input was not 'YES'."
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: guard
    environment: production

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish
        run: dotnet publish src/AkeroGarden.Web --configuration Release --output ./publish

      - name: Deploy to Azure App Service (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
