# Manual-only. Production deploys require an approval on the "production" Environment
# (Azure DevOps → Environments → production → Approvals and checks) — configure that
# approval in the UI before this pipeline's first real run; it replaces the old
# GitHub Actions "type YES to confirm" input with a proper gate.
#
# Build-once, deploy-that-artifact: this pipeline does NOT rebuild. It downloads the
# admin/public artifacts produced by a *green* CI run (the `ci` pipeline resource below)
# and deploys exactly those bits. When you run it manually, pick which CI run to deploy
# (defaults to the latest successful) — so production only ever ships a build that passed
# every test tier in CI.
#
# Two-app topology (Phase 10b): both host apps live on their own sites on the one plan. The
# ADMIN app is the sole DB-migrating/seeding process, so it deploys FIRST (before the public
# site, which reads the schema admin creates).
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

resources:
  pipelines:
    - pipeline: ci
      source: CI # the display name of the azure-pipelines.yml pipeline
      trigger: none # stay manual — production is deployed on demand behind the environment approval

jobs:
  - deployment: deploy_production
    displayName: Deploy both apps to Azure App Service (production)
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
            - download: ci
              artifact: admin
              displayName: Download admin artifact (CI-tested build)

            - download: ci
              artifact: public
              displayName: Download public artifact (CI-tested build)

            - task: AzureWebApp@1
              displayName: Deploy admin site (migrates the DB — deploy first)
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-prod-admin"
                package: "$(Pipeline.Workspace)/ci/admin"

            - task: AzureWebApp@1
              displayName: Deploy public site
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-prod-public"
                package: "$(Pipeline.Workspace)/ci/public"
