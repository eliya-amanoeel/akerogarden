trigger:
  branches:
    include: ["*"]
  paths:
    exclude:
      - "**/*.md"

pr:
  branches:
    include: [main]
  paths:
    exclude:
      - "**/*.md"

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: postgres
      image: postgres:16
      ports:
        - 5432:5432
      env:
        POSTGRES_USER: akerogarden
        POSTGRES_PASSWORD: akerogarden_ci
        POSTGRES_DB: akerogarden_test
      options: >-
        --health-cmd "pg_isready -U akerogarden"
        --health-interval 5s
        --health-timeout 5s
        --health-retries 10
    - container: redis
      image: redis:7-alpine
      ports:
        - 6379:6379
      options: >-
        --health-cmd "redis-cli ping"
        --health-interval 5s
        --health-timeout 3s
        --health-retries 10

jobs:
  - job: build_and_test
    displayName: Build and test
    services:
      postgres: postgres
      redis: redis
    variables:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - checkout: self

      - task: UseDotNet@2
        displayName: Setup .NET 10
        inputs:
          packageType: sdk
          useGlobalJson: true

      - script: dotnet restore
        displayName: Restore

      - script: dotnet build --no-restore --configuration Release
        displayName: Build

      - script: dotnet test tests/AkeroGarden.Unit --no-build --configuration Release --logger "console;verbosity=normal" --logger trx
        displayName: Unit tests

      - script: dotnet test tests/AkeroGarden.Integration --no-build --configuration Release --logger "console;verbosity=normal" --logger trx
        displayName: Integration tests
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=akerogarden_test;Username=akerogarden;Password=akerogarden_ci"
          Redis__ConnectionString: "localhost:6379"

      # End-to-end / UI tests (Playwright). The E2E suite boots its own ephemeral Postgres
      # (Testcontainers) and launches the app on a real Kestrel port, so it needs the browser
      # + OS deps installed first. pwsh is preinstalled on the ubuntu-latest image.
      - script: pwsh tests/AkeroGarden.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
        displayName: Install Playwright browsers

      - script: dotnet test tests/AkeroGarden.E2E --no-build --configuration Release --logger "console;verbosity=normal" --logger trx
        displayName: E2E tests
        env:
          E2E_WEB_CONFIG: Release

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: "**/*.trx"
