# Manual-only. Staging is powered down when idle, so deploys are triggered on demand
# (Pipelines → "Deploy — Staging" → Run pipeline) rather than automatically on every
# merge to main. Before running: start staging in order — PostgreSQL first (wait until
# Ready), then the app — so the on-boot EF migrations succeed.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  - deployment: deploy_staging
    displayName: Deploy to Azure App Service (staging)
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: UseDotNet@2
              displayName: Setup .NET 10
              inputs:
                packageType: sdk
                useGlobalJson: true

            - script: dotnet publish src/AkeroGarden.Web --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
              displayName: Publish

            - task: AzureWebApp@1
              displayName: Deploy to Azure App Service (staging)
              inputs:
                azureSubscription: "akerogarden-azure-connection"
                appType: webAppLinux
                appName: "jmk-ag-staging-app"
                package: "$(Build.ArtifactStagingDirectory)/publish"
