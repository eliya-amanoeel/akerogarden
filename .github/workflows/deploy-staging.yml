name: Deploy — Staging

# Manual-only. Staging is powered down when idle, so deploys are triggered on demand
# (Actions → "Deploy — Staging" → Run workflow, or `gh workflow run deploy-staging.yml`)
# rather than automatically on every merge to main. Before running: start staging in order
# — PostgreSQL first (wait until Ready), then the app — so the on-boot EF migrations succeed.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/AkeroGarden.Web --configuration Release --output ./publish

      - name: Deploy to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
